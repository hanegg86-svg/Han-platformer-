<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Platformer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- App Header Bar -->
        <header class="app-header">
            <h1>Platformer Pro</h1>
            <div class="header-stats">
                <span>ด่าน: <strong id="hud-level">1</strong></span>
                <span>คะแนน: <strong id="hud-score">0</strong></span>
                <span>สูงสุด: <strong id="hud-highscore">0</strong></span>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="app-content">
            <!-- Game Tab View -->
            <section id="view-game" class="tab-view active">
                <div class="canvas-container">
                    <canvas id="gameCanvas"></canvas>
                    
                    <!-- Game Over Overlay Modal -->
                    <div id="game-over-overlay" class="overlay hidden">
                        <div class="modal-card">
                            <h2>Game Over!</h2>
                            <p>คะแนนที่คุณทำได้: <span id="final-score">0</span></p>
                            <button id="btn-restart" class="btn btn-primary">เล่นใหม่อีกครั้ง</button>
                        </div>
                    </div>
                </div>

                <!-- Touch Controller Overlay -->
                <div class="touch-controls">
                    <div class="dpad">
                        <button id="btn-left" class="touch-btn">◀</button>
                        <button id="btn-right" class="touch-btn">▶</button>
                    </div>
                    <div class="action-btns">
                        <button id="btn-jump" class="touch-btn btn-action">กระโดด</button>
                    </div>
                </div>
            </section>

            <!-- Stats Tab View -->
            <section id="view-stats" class="tab-view">
                <div class="card">
                    <h2>สถิติการเล่น</h2>
                    <div class="stat-row">
                        <span>คะแนนสูงสุด:</span>
                        <strong id="stats-highscore">0</strong>
                    </div>
                    <div class="stat-row">
                        <span>จำนวนครั้งที่เล่น:</span>
                        <strong id="stats-games-played">0</strong>
                    </div>
                </div>
            </section>

            <!-- Settings Tab View -->
            <section id="view-settings" class="tab-view">
                <div class="card">
                    <h2>ตั้งค่าเกม</h2>
                    <div class="setting-item">
                        <label for="sound-toggle">เสียงเอฟเฟกต์</label>
                        <input type="checkbox" id="sound-toggle" checked>
                    </div>
                    <button id="btn-reset-data" class="btn btn-danger">รีเซ็ตข้อมูลทั้งหมด</button>
                </div>
            </section>
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-tab="game">
                <span class="nav-icon">🎮</span>
                <span class="nav-label">เล่นเกม</span>
            </button>
            <button class="nav-btn" data-tab="stats">
                <span class="nav-icon">🏆</span>
                <span class="nav-label">สถิติ</span>
            </button>
            <button class="nav-btn" data-tab="settings">
                <span class="nav-icon">⚙️</span>
                <span class="nav-label">ตั้งค่า</span>
            </button>
        </nav>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
